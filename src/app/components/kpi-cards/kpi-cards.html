<div class="kpi-container">
  <!-- Card 1: Total Flights -->
  <div class="kpi-card total">
    <div class="card-icon">✈️</div>
    <div class="card-info">
      <span class="card-label">Total Flights</span>
      <h3 class="card-value">{{ metrics.totalFlights }}</h3>
    </div>
  </div>

  <!-- Card 2: Active Flights -->
  <div class="kpi-card active">
    <div class="card-icon">🟢</div>
    <div class="card-info">
      <span class="card-label">Active Flights</span>
      <h3 class="card-value">{{ metrics.activeFlights }}</h3>
    </div>
  </div>

  <!-- Card 3: Delayed Flights -->
  <div class="kpi-card delayed">
    <div class="card-icon">⚠️</div>
    <div class="card-info">
      <span class="card-label">Delayed Flights</span>
      <h3 class="card-value">{{ metrics.delayedFlights }}</h3>
    </div>
  </div>

  <!-- Card 4: Arrived Flights -->
  <div class="kpi-card arrived">
    <div class="card-icon">🏁</div>
    <div class="card-info">
      <span class="card-label">Arrived Flights</span>
      <h3 class="card-value">{{ metrics.arrivedFlights }}</h3>
    </div>
  </div>
</div>
