<div class="dashboard-shell">
  <!-- Top Navigation Header -->
  <header class="dashboard-header">
    <div class="brand">
      <span class="radar-icon">📡</span>
      <div>
        <h1>AeroTrack Ops</h1>
        <p class="subtitle">Live Flight Tracking & Airspace Operations Dashboard</p>
      </div>
    </div>
    <div class="system-status">
      <span class="pulse-indicator"></span> Live Feed Active
    </div>
  </header>

  <main class="dashboard-body">
    <!-- 1. KPI Cards Row (Total, Active, Delayed, Arrived) -->
    <app-kpi-cards></app-kpi-cards>

    <!-- 2. Search & Filter Bar -->
    <app-flight-filters></app-flight-filters>

    <!-- 3. Primary Workspace: Interactive Map (Left) + Details Panel (Right) -->
    <div class="main-workspace-grid">
      <div class="map-section">
        <app-flight-map></app-flight-map>
      </div>
      <aside class="details-section">
        <app-flight-details></app-flight-details>
      </aside>
    </div>

    <!-- 4. Bottom Table: Full Interactive Flight Schedule -->
    <section class="schedule-section">
      <app-flight-list></app-flight-list>
    </section>
  </main>
</div>
